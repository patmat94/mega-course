# wake-demo: the shared wake module (lib/wake, ADR 0009) wired into one Worker.
# Plan § 5 runs it under wrangler dev only; § 6 (issue #7) deploys it after the human's yes (#5).
name = "wake-demo"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[kv_namespaces]]
binding = "KV"
id = "f43d5cdda048498dab58708897e47e57" # wake-demo-kv, created 2026-11-10 (#7); wrangler dev keeps its own local copy

[[queues.producers]]
queue = "wake-demo-jobs"
binding = "JOBS"

[[queues.consumers]]
queue = "wake-demo-jobs"
max_batch_size = 1
max_retries = 40 # above the module's maxTries (30), so the module writes the last row (WAKE.md § consume)

# Secrets (never in this file): SIGNING_KEY, ADMIN_TOKEN, NTFY_URL.
# NTFY_URL is a secret, not a var: the repo is public and an ntfy topic is open to anyone who knows it.
# Locally they come from .dev.vars (test/e2e-local.mjs writes it); deployed, from `wrangler secret put`.
